services:
  agent:
    build: .
    container_name: adaptive-shaper
    restart: unless-stopped
    ports:
      - "9090:9090"
    environment:
      - ROUTEROS_PASSWORD=${ROUTEROS_PASSWORD}

  prometheus:
    image: prom/prometheus:latest
    container_name: shaper-prometheus
    restart: unless-stopped
    ports:
      - "9091:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: grafana/grafana:latest
    container_name: shaper-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    volumes:
      - grafana-data:/var/lib/grafana

volumes:
  grafana-data: